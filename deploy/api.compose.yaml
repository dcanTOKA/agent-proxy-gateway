services:
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8000"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
