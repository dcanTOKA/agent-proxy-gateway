[project]
name = "agent-gateway"
version = "0.2.0"
description = "A small Azure gateway for agent web tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "pydantic-settings==2.13.1",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.5", "python-hcl2==7.3.1", "pyyaml==6.0.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
